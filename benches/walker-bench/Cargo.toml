[workspace]

[package]
name = "walker-bench"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "walker-bench"
path = "src/main.rs"

[dependencies]
dua-core = "3"
ignore = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
] }
